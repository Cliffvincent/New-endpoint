<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
  <title>Discover the top streamed music and songs online on SoundCloud</title>
  <meta name="description" content="Discover and play songs, tracks, and music playlists by genre and popularity on SoundCloud desktop and mobile."/>
  <meta name="keywords" content="record, sounds, share, sound, audio, tracks, music, soundcloud"/>
  <meta name="referrer" content="origin"/>
  <link rel="icon" type="image/png" sizes="16x16" href="https://m.sndcdn.com/_next/static/images/favicon-16-b8c7cd12bb1f82f55f785072ad6c2138.png"/>
  <link rel="icon" type="image/png" sizes="32x32" href="https://m.sndcdn.com/_next/static/images/favicon-32-7c86406588c8fb13cb11b779c7ebe9eb.png"/>
  <link rel="apple-touch-icon" href="https://m.sndcdn.com/_next/static/images/apple-touch-icon-120-810d80d153fe7629e01c78e25c021747.png"/>
  <link rel="apple-touch-icon" sizes="180x180" href="https://m.sndcdn.com/_next/static/images/apple-touch-icon-180-893d0d532e8fbba714cceb8d9eae9567.png"/>
  <meta property="og:image" content="/sc.png"/>
  <link rel="search" type="application/opensearchdescription+xml" href="/sc-opensearch.xml" title="SoundCloud"/>
  <meta name="theme-color" content="#333"/>
  <meta property="fb:app_id" content="19507961798"/>
  <meta property="og:site_name" content="SoundCloud"/>
  <meta property="al:ios:app_name" content="SoundCloud"/>
  <meta property="al:ios:app_store_id" content="336353151"/>
  <meta property="al:android:app_name" content="SoundCloud"/>
  <meta property="al:android:package" content="com.soundcloud.android"/>
  <meta name="twitter:app:name:iphone" content="SoundCloud"/>
  <meta name="twitter:app:id:iphone" content="336353151"/>
  <meta name="twitter:app:name:ipad" content="SoundCloud"/>
  <meta name="twitter:app:id:ipad" content="336353151"/>
  <meta name="twitter:app:name:googleplay" content="SoundCloud"/>
  <meta name="twitter:app:id:googleplay" content="com.soundcloud.android"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0e0e0e;
      --surface: #181818;
      --surface2: #242424;
      --surface3: #2e2e2e;
      --border: #2e2e2e;
      --accent: #f26f21;
      --accent-dim: rgba(242,111,33,0.15);
      --text: #fff;
      --sub: #aaa;
      --muted: #666;
      --nav-h: 62px;
      --mini-h: 68px;
    }
    html, body { height: 100%; background: #111; margin: 0; overflow-x: hidden; width: 100%; }
    body { font-family: 'Inter', sans-serif; font-size: 14px; display: flex; justify-content: center; }
    #app { position: relative; width: 100%; max-width: 480px; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); box-shadow: 0 0 40px rgba(0,0,0,0.8); }
    .page { position: absolute; inset: 0; display: flex; flex-direction: column; overflow: hidden; transition: transform 0.3s cubic-bezier(.4,0,.2,1), opacity 0.3s; will-change: transform; }
    .page.hidden { transform: translateX(100%); opacity: 0; pointer-events: none; }
    .page.slide-up { transform: translateY(100%); opacity: 0; pointer-events: none; }
    .topbar { flex-shrink: 0; background: rgba(14,14,14,0.96); backdrop-filter: blur(16px); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 14px; padding: 0 18px; height: 56px; }
    .sc-logo { display: flex; align-items: center; gap: 8px; text-decoration: none; }
    .sc-logo-text { font-size: 17px; font-weight: 800; color: var(--accent); letter-spacing: -0.3px; }
    .topbar-search-btn { margin-left: auto; background: none; border: none; color: var(--sub); cursor: pointer; padding: 6px; display: flex; align-items: center; border-radius: 50%; transition: color 0.2s, background 0.2s; overflow: hidden; width: 36px; height: 36px; justify-content: center; }
    .topbar-search-btn:hover { color: var(--text); background: var(--surface2); }
    .page-body { flex: 1; overflow-y: auto; overflow-x: hidden; padding-bottom: calc(var(--mini-h) + var(--nav-h)); }
    .main { padding: 16px 14px; }
    .bottom-nav { position: absolute; bottom: 0; left: 0; right: 0; height: var(--nav-h); background: rgba(12,12,12,0.98); backdrop-filter: blur(20px); border-top: 1px solid var(--border); display: flex; align-items: stretch; z-index: 500; }
    .nav-tab { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; cursor: pointer; background: none; border: none; color: var(--muted); transition: color 0.15s; font-family: inherit; padding-bottom: 4px; }
    .nav-tab.active { color: var(--accent); }
    .nav-tab svg { flex-shrink: 0; }
    .nav-tab span { font-size: 10px; font-weight: 500; }
    .mini-player { position: absolute; left: 0; right: 0; bottom: var(--nav-h); height: var(--mini-h); background: rgba(22,22,22,0.98); backdrop-filter: blur(24px); border-top: 1px solid var(--border); display: none; align-items: center; padding: 0 14px; gap: 12px; z-index: 400; cursor: pointer; }
    .mini-player.visible { display: flex; }
    .mini-progress { position: absolute; top: 0; left: 0; height: 2px; background: var(--accent); width: 0%; transition: width 0.3s linear; }
    .mini-art { width: 46px; height: 46px; border-radius: 6px; object-fit: cover; background: var(--surface2); flex-shrink: 0; }
    .mini-art-ph { width: 46px; height: 46px; border-radius: 6px; background: var(--surface2); flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 20px; color: var(--muted); }
    .mini-meta { flex: 1; min-width: 0; }
    .mini-title { font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .mini-artist { font-size: 11px; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .mini-btns { display: flex; gap: 4px; align-items: center; }
    .mini-btn { background: none; border: none; color: var(--sub); cursor: pointer; padding: 7px; display: flex; align-items: center; border-radius: 50%; transition: color 0.2s; }
    .mini-btn:hover { color: var(--text); }
    .mini-play-btn { width: 34px; height: 34px; background: var(--text); border: none; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--bg); transition: transform 0.1s; }
    .mini-play-btn:hover { transform: scale(1.06); }
    .discover-section { margin-bottom: 28px; }
    .section-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .section-title { font-size: 17px; font-weight: 700; }
    .horizontal-scroll { display: flex; gap: 12px; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; scrollbar-width: none; -webkit-overflow-scrolling: touch; padding-bottom: 4px; }
    .horizontal-scroll::-webkit-scrollbar { display: none; }
    .horizontal-scroll .playlist-card { flex: 0 0 140px; width: 140px; scroll-snap-align: start; background: var(--surface); border-radius: 10px; overflow: hidden; cursor: pointer; transition: background 0.15s, transform 0.15s; border: 1px solid transparent; }
    .horizontal-scroll .playlist-card:hover { background: var(--surface2); transform: translateY(-2px); border-color: var(--border); }
    .horizontal-scroll .playlist-thumb { width: 140px; height: 140px; object-fit: cover; background: var(--surface3); display: block; }
    .horizontal-scroll .playlist-thumb-ph { width: 140px; height: 140px; background: linear-gradient(135deg, #2b2b2b, #111); display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; color: var(--text); padding: 8px; text-align: center; }
    .playlist-info { padding: 8px 10px 10px; }
    .playlist-name { font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 2px; }
    .playlist-meta { font-size: 11px; color: var(--muted); }
    .state-box { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 60px 20px; color: var(--muted); text-align: center; gap: 12px; }
    .state-box svg { opacity: 0.3; }
    .state-box p { font-size: 15px; }
    .state-box small { font-size: 13px; opacity: 0.7; }
    .spinner { width: 28px; height: 28px; border: 3px solid var(--surface3); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .search-bar-wrap { padding: 14px 16px; background: var(--bg); position: sticky; top: 0; z-index: 10; border-bottom: 1px solid var(--border); }
    .search-input-box { display: flex; align-items: center; background: var(--surface2); border-radius: 8px; padding: 0 12px; height: 42px; border: 1px solid var(--border); }
    .search-input-box input { flex: 1; background: none; border: none; color: var(--text); font-size: 14px; outline: none; font-family: inherit; }
    .search-input-box input::placeholder { color: var(--muted); }
    .search-input-box svg { color: var(--sub); flex-shrink: 0; margin-right: 8px; }
    .search-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 16px; }
    .genre-card { height: 96px; border-radius: 8px; padding: 12px; font-weight: 700; font-size: 15px; color: #fff; display: flex; align-items: flex-end; cursor: pointer; position: relative; overflow: hidden; text-shadow: 0 1px 3px rgba(0,0,0,0.5); }
    .search-results-list { padding: 10px 16px; }
    .search-track-item { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); cursor: pointer; }
    .search-track-item:hover .search-track-title { color: var(--accent); }
    .search-track-art { width: 44px; height: 44px; border-radius: 6px; object-fit: cover; background: var(--surface2); flex-shrink: 0; }
    .search-track-info { flex: 1; min-width: 0; }
    .search-track-title { font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 2px; }
    .search-track-artist { font-size: 12px; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #playlistPage, #artistPage { background: var(--bg); }
    .pl-topbar { flex-shrink: 0; display: flex; align-items: center; gap: 12px; padding: 0 14px; height: 52px; background: rgba(14,14,14,0.8); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 10; }
    .back-btn { background: none; border: none; width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; color: var(--text); cursor: pointer; border-radius: 50%; transition: background 0.2s; flex-shrink: 0; }
    .back-btn:hover { background: var(--surface2); }
    .pl-page-body { flex: 1; overflow-y: auto; overflow-x: hidden; padding-bottom: calc(var(--mini-h) + var(--nav-h)); }
    .pl-hero { position: relative; width: 100%; aspect-ratio: 1; max-height: 320px; overflow: hidden; flex-shrink: 0; }
    .pl-hero-img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .pl-hero-ph { width: 100%; height: 100%; background: #1a1a1a; display: flex; align-items: center; justify-content: center; font-size: 80px; }
    .pl-hero-grad { position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(0,0,0,0.1) 40%, rgba(14,14,14,1) 100%); }
    .pl-info { padding: 14px 18px 0; }
    .pl-title { font-size: 22px; font-weight: 700; letter-spacing: -0.4px; margin-bottom: 4px; }
    .pl-curator { display: flex; align-items: center; gap: 5px; font-size: 14px; color: var(--sub); margin-bottom: 8px; font-weight: 500; }
    .pl-meta-row { font-size: 12px; color: var(--muted); margin-bottom: 14px; }
    .pl-actions { display: flex; align-items: center; gap: 18px; padding-bottom: 14px; border-bottom: 1px solid var(--border); margin-bottom: 6px; }
    .pl-action-btn { display: flex; align-items: center; gap: 5px; background: none; border: none; color: var(--sub); font-size: 13px; cursor: pointer; transition: color 0.2s; font-family: inherit; }
    .pl-action-btn:hover { color: var(--text); }
    .pl-shuffle-btn { width: 46px; height: 46px; background: var(--text); border: none; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--bg); margin-left: auto; transition: transform 0.1s; }
    .pl-shuffle-btn:hover { transform: scale(1.05); }
    .pl-track-list { padding: 4px 6px; }
    .pl-track-item { display: flex; align-items: center; gap: 12px; padding: 9px 10px; border-radius: 8px; cursor: pointer; transition: background 0.15s; }
    .pl-track-item:hover { background: var(--surface2); }
    .pl-track-item.active { background: var(--accent-dim); }
    .pl-track-item.active .pl-track-title { color: var(--accent); }
    .pl-track-art { width: 42px; height: 42px; border-radius: 6px; object-fit: cover; background: var(--surface3); display: block; flex-shrink: 0; }
    .pl-track-art-ph { width: 42px; height: 42px; border-radius: 6px; background: #1c1c1c; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
    .pl-track-info { flex: 1; min-width: 0; }
    .pl-track-title { font-weight: 500; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 2px; }
    .pl-track-artist { font-size: 12px; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pl-track-dur { color: var(--muted); font-size: 12px; flex-shrink: 0; }
    #nowPlayingPage { z-index: 600; overflow: hidden; }
    .np-full-bg { position: absolute; inset: 0; background-size: cover; background-position: center; transform: scale(1.04); pointer-events: none; transition: background-image 0.4s; }
    .np-overlay { position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(0,0,0,0.45) 0%, rgba(0,0,0,0.1) 35%, rgba(0,0,0,0.1) 55%, rgba(0,0,0,0.65) 75%, rgba(0,0,0,0.85) 100%); pointer-events: none; }
    .np-content { position: relative; z-index: 1; display: flex; flex-direction: column; height: 100%; }
    .np-topbar { display: flex; align-items: flex-start; justify-content: space-between; padding: 52px 22px 0; gap: 16px; }
    .np-track-info { flex: 1; min-width: 0; }
    .np-title { font-size: 20px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 1px 8px rgba(0,0,0,0.7); }
    .np-artist { font-size: 14px; color: rgba(255,255,255,0.75); margin-top: 3px; text-shadow: 0 1px 6px rgba(0,0,0,0.7); }
    .np-down-btn { width: 40px; height: 40px; flex-shrink: 0; background: rgba(0,0,0,0.55); border: none; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #fff; backdrop-filter: blur(8px); transition: background 0.2s; }
    .np-down-btn:hover { background: rgba(0,0,0,0.75); }
    .np-spacer { flex: 1; }
    .np-controls { display: flex; align-items: center; justify-content: center; gap: 28px; padding: 0 24px; }
    .np-play-btn { width: 72px; height: 72px; background: rgba(255,255,255,0.92); border: none; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #000; box-shadow: 0 8px 32px rgba(0,0,0,0.6); transition: transform 0.1s, background 0.2s; }
    .np-play-btn:hover { transform: scale(1.05); background: #fff; }
    .np-skip-btn { width: 56px; height: 56px; background: rgba(255,255,255,0.92); border: none; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #000; box-shadow: 0 4px 18px rgba(0,0,0,0.5); transition: transform 0.1s, background 0.2s; }
    .np-skip-btn:hover { transform: scale(1.07); background: #fff; }
    .np-waveform-area { padding: 28px 18px 0; }
    .np-waveform { width: 100%; height: 56px; display: flex; align-items: flex-end; gap: 1.5px; cursor: pointer; overflow: hidden; }
    .np-wf-bar { flex: 1; min-width: 1.5px; border-radius: 2px; }
    .np-wf-bar.played { background: var(--accent); }
    .np-wf-bar.unplayed { background: rgba(255,255,255,0.25); }
    .np-time-row { display: flex; justify-content: space-between; align-items: center; padding: 7px 2px 0; }
    .np-time-badge { background: rgba(0,0,0,0.7); border-radius: 4px; padding: 2px 8px; font-size: 12px; font-weight: 700; color: #fff; }
    .np-time-badge.accent { background: var(--accent); }
    .np-stats { display: flex; justify-content: space-around; align-items: center; padding: 18px 20px 44px; }
    .np-stat-btn { display: flex; align-items: center; gap: 6px; background: none; border: none; color: rgba(255,255,255,0.7); font-size: 14px; cursor: pointer; font-family: inherit; transition: color 0.2s; }
    .np-stat-btn:hover { color: #fff; }
  </style>
</head>
<body>
  <div id="app">
    <div class="page" id="homePage">
      <header class="topbar">
        <div class="sc-logo">
          <img src="https://logo-teka.com/wp-content/uploads/2025/12/soundcloud-icon-logo.png" height="28" alt="SoundCloud" style="display:block;filter:brightness(0) invert(1)"/>
          <span class="sc-logo-text">SoundCloud</span>
        </div>
      </header>
      <div class="page-body">
        <div class="main">
          <div id="discoverView">
            <div class="state-box" id="discoverLoading">
              <div class="spinner"></div>
              <p>Loading…</p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="page hidden" id="searchPage">
      <header class="topbar">
        <div class="sc-logo">
          <img src="https://logo-teka.com/wp-content/uploads/2025/12/soundcloud-icon-logo.png" height="28" alt="SoundCloud" style="display:block;filter:brightness(0) invert(1)"/>
          <span class="sc-logo-text">SoundCloud</span>
        </div>
      </header>
      <div class="search-bar-wrap">
        <div class="search-input-box">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <circle cx="11" cy="11" r="8"/>
            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          <input type="text" id="searchInput" placeholder="Search for artists, bands, tracks, podcasts">
        </div>
      </div>
      <div class="page-body" id="searchBody">
        <div class="search-grid" id="searchGenres">
          <div class="genre-card" style="background:linear-gradient(135deg,#f43f5e,#fb7185)" onclick="doGenreSearch('Hip-hop & Rap')">Hip-hop & Rap</div>
          <div class="genre-card" style="background:linear-gradient(135deg,#8b5cf6,#c084fc)" onclick="doGenreSearch('Electronic')">Electronic</div>
          <div class="genre-card" style="background:linear-gradient(135deg,#06b6d4,#67e8f9)" onclick="doGenreSearch('Pop')">Pop</div>
          <div class="genre-card" style="background:linear-gradient(135deg,#10b981,#34d399)" onclick="doGenreSearch('Rock')">Rock</div>
          <div class="genre-card" style="background:linear-gradient(135deg,#f59e0b,#fcd34d)" onclick="doGenreSearch('Alternative')">Alternative</div>
          <div class="genre-card" style="background:linear-gradient(135deg,#ec4899,#f472b6)" onclick="doGenreSearch('R&B & Soul')">R&B & Soul</div>
        </div>
      </div>
    </div>

    <div class="page hidden" id="libraryPage">
      <header class="topbar">
        <div class="sc-logo">
          <img src="https://logo-teka.com/wp-content/uploads/2025/12/soundcloud-icon-logo.png" height="28" alt="SoundCloud" style="display:block;filter:brightness(0) invert(1)"/>
          <span class="sc-logo-text">SoundCloud</span>
        </div>
      </header>
      <div class="page-body">
        <div class="state-box" style="padding-top:120px">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/>
          </svg>
          <p>Your Library is empty</p>
          <small>Liked tracks and saved playlists will appear here.</small>
        </div>
      </div>
    </div>

    <div class="page hidden" id="playlistPage">
      <div class="pl-topbar">
        <button class="back-btn" id="plBackBtn">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M19 12H5M12 5l-7 7 7 7"/>
          </svg>
        </button>
      </div>
      <div class="pl-page-body" id="playlistPageBody"></div>
    </div>

    <div class="page slide-up" id="nowPlayingPage">
      <div class="np-full-bg" id="npFullBg"></div>
      <div class="np-overlay"></div>
      <div class="np-content">
        <div class="np-topbar">
          <div class="np-track-info">
            <div class="np-title" id="npTitle"></div>
            <div class="np-artist" id="npArtist"></div>
          </div>
          <button class="np-down-btn" onclick="closeNowPlaying()">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <path d="M6 9l6 6 6-6"/>
            </svg>
          </button>
        </div>
        <div class="np-spacer"></div>
        <div class="np-controls">
          <button class="np-skip-btn" onclick="skipTrack(-1)">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
              <path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/>
            </svg>
          </button>
          <button class="np-play-btn" onclick="togglePlay()">
            <svg id="npPlayIcon" width="32" height="32" viewBox="0 0 24 24" fill="currentColor">
              <path d="M8 5v14l11-7z"/>
            </svg>
          </button>
          <button class="np-skip-btn" onclick="skipTrack(1)">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
              <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/>
            </svg>
          </button>
        </div>
        <div class="np-spacer"></div>
        <div class="np-waveform-area">
          <div class="np-waveform" id="npWaveform" onclick="waveformSeek(event)"></div>
          <div class="np-time-row">
            <span class="np-time-badge accent" id="npTimeCur">0:00</span>
            <span class="np-time-badge" id="npTimeDur">0:00</span>
          </div>
        </div>
        <div class="np-stats">
          <button class="np-stat-btn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
            </svg>
            <span id="npLikeCount">0</span>
          </button>
          <button class="np-stat-btn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
            </svg>
            <span id="npCommentCount">0</span>
          </button>
          <button class="np-stat-btn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="17 1 21 5 17 9"/>
              <path d="M3 11V9a4 4 0 0 1 4-4h14"/>
              <polyline points="7 23 3 19 7 15"/>
              <path d="M21 13v2a4 4 0 0 1-4 4H3"/>
            </svg>
            <span id="npRepostCount">0</span>
          </button>
        </div>
      </div>
    </div>

    <div class="mini-player" id="miniPlayer" onclick="openNowPlaying()">
      <div class="mini-progress" id="miniProgress"></div>
      <div class="mini-art-ph" id="miniArtWrap">🎵</div>
      <div class="mini-meta">
        <div class="mini-title" id="miniTitle"></div>
        <div class="mini-artist" id="miniArtist"></div>
      </div>
      <div class="mini-btns" onclick="event.stopPropagation()">
        <button class="mini-btn" onclick="skipTrack(-1)">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor">
            <path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/>
          </svg>
        </button>
        <button class="mini-play-btn" onclick="togglePlay()">
          <svg id="miniPlayIcon" width="15" height="15" viewBox="0 0 24 24" fill="currentColor">
            <path d="M8 5v14l11-7z"/>
          </svg>
        </button>
        <button class="mini-btn" onclick="skipTrack(1)">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor">
            <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/>
          </svg>
        </button>
      </div>
    </div>

    <nav class="bottom-nav">
      <button class="nav-tab active" id="navHome" onclick="switchTab('homePage', this)">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        <span>Discover</span>
      </button>
      <button class="nav-tab" id="navSearch" onclick="switchTab('searchPage', this)">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <span>Search</span>
      </button>
      <button class="nav-tab" id="navLibrary" onclick="switchTab('libraryPage', this)">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/>
        </svg>
        <span>Library</span>
      </button>
    </nav>

    <audio id="audio"></audio>
  </div>

  <script>
    const audio = document.getElementById('audio');
    let tracks = [];
    let currentIdx = -1;
    let currentContext = null;

    function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
    function fmtNum(n) { if (!n) return '0'; if (n>=1e6) return (n/1e6).toFixed(1)+'M'; if (n>=1e3) return (n/1e3).toFixed(1)+'K'; return String(n); }
    function fmtSec(s) { if (!s||isNaN(s)) return '0:00'; return Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0'); }

    function switchTab(pageId, btn) {
      document.querySelectorAll('.page').forEach(p => {
        if (p.id !== 'nowPlayingPage' && p.id !== 'playlistPage') {
          p.classList.add('hidden');
        }
      });
      document.getElementById('playlistPage').classList.add('hidden');
      document.getElementById(pageId).classList.remove('hidden');
      document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
      btn.classList.add('active');
    }

    function openNowPlaying() { document.getElementById('nowPlayingPage').classList.remove('slide-up'); }
    function closeNowPlaying() { document.getElementById('nowPlayingPage').classList.add('slide-up'); }

    async function loadDiscover() {
      try {
        const res = await fetch('/discover');
        const data = await res.json();
        renderDiscover(data.initialStoreState);
      } catch {
        document.getElementById('discoverLoading').innerHTML = '<p style="color:#f87171">Could not load.</p>';
      }
    }

    function renderDiscover(storeState) {
      const container = document.getElementById('discoverView');
      container.innerHTML = '';
      if (!storeState || !storeState.systemPlaylists) {
        container.innerHTML = '<div class="state-box"><p>No discover content found.</p></div>';
        return;
      }

      const systemPlaylists = storeState.systemPlaylists;
      const allPlaylists = storeState.playlists || {};

      let html = '';

      const playlistKeys = Object.keys(allPlaylists);
      if (playlistKeys.length) {
        html += `
          <div class="discover-section">
            <div class="section-head"><div class="section-title">Featured Playlists</div></div>
            <div class="horizontal-scroll">
              ${playlistKeys.map(key => {
                const p = allPlaylists[key].data;
                if (!p) return '';
                return `
                  <div class="playlist-card" onclick="openPlaylist('${esc(p.id)}')">
                    ${p.artwork_url
                      ? `<img class="playlist-thumb" src="${esc(p.artwork_url)}" loading="lazy" alt="" onerror="this.outerHTML='<div class=\\'playlist-thumb-ph\\'>${esc(p.title||'')}</div>'" />`
                      : `<div class="playlist-thumb-ph">${esc(p.title||'Playlist')}</div>`}
                    <div class="playlist-info">
                      <div class="playlist-name">${esc(p.title||'')}</div>
                      <div class="playlist-meta">${p.track_count ? p.track_count+' tracks' : ''}</div>
                    </div>
                  </div>`;
              }).join('')}
            </div>
          </div>`;
      }

      const sysKeys = Object.keys(systemPlaylists);
      sysKeys.forEach(key => {
        const sp = systemPlaylists[key].data;
        if (!sp || !sp.tracks || !sp.tracks.length) return;

        html += `
          <div class="discover-section">
            <div class="section-head"><div class="section-title">${esc(sp.title)} (${esc(sp.description)})</div></div>
            <div class="horizontal-scroll">
              ${sp.tracks.slice(0, 10).map(trackUrn => {
                const artUrl = sp.calculated_artwork_url || '';
                return `
                  <div class="playlist-card" onclick="playTrackDirect({id: '${trackUrn}', title: '${esc(sp.title)} Track', artwork_url: '${artUrl}'})">
                    ${artUrl
                      ? `<img class="playlist-thumb" src="${esc(artUrl)}" loading="lazy" alt="" />`
                      : `<div class="playlist-thumb-ph">${esc(sp.title)}</div>`}
                    <div class="playlist-info">
                      <div class="playlist-name">Track ID</div>
                      <div class="playlist-meta">${trackUrn.split(':').pop()}</div>
                    </div>
                  </div>`;
              }).join('')}
            </div>
          </div>`;
      });

      container.innerHTML = html;
    }

    async function openPlaylist(id) {
      if (!id) return;
      document.getElementById('homePage').classList.add('hidden');
      document.getElementById('searchPage').classList.add('hidden');
      document.getElementById('libraryPage').classList.add('hidden');
      const pl = document.getElementById('playlistPage');
      pl.classList.remove('hidden');
      document.getElementById('playlistPageBody').innerHTML = '<div class="state-box"><div class="spinner"></div><p>Loading playlist…</p></div>';
      document.getElementById('plBackBtn').onclick = () => {
        pl.classList.add('hidden');
        document.getElementById('homePage').classList.remove('hidden');
      };

      try {
        const res = await fetch('/playlist?id=' + encodeURIComponent(id));
        const data = await res.json();
        renderPlaylistPage(data.results || data);
      } catch {
        document.getElementById('playlistPageBody').innerHTML = '<div class="state-box"><p style="color:#f87171">Failed to load playlist.</p></div>';
      }
    }

    function renderPlaylistPage(pl) {
      tracks = (pl.tracks || []).map(t => ({
        id: t.id,
        title: t.title || 'Track',
        duration: t.duration,
        artwork_url: t.artwork_url || pl.artwork_url,
        permalink_url: t.permalink_url,
        user: { username: t.user?.username || pl.user?.username || 'SoundCloud' },
        playback_count: t.playback_count || 0,
        likes_count: t.likes_count || 0,
        comment_count: t.comment_count || 0
      }));
      currentContext = 'playlist';

      const body = document.getElementById('playlistPageBody');
      body.innerHTML = `
        <div style="position:relative">
          <div class="pl-hero">
            ${pl.artwork_url ? `<img class="pl-hero-img" src="${esc(pl.artwork_url)}" alt="" />` : `<div class="pl-hero-ph">🎵</div>`}
            <div class="pl-hero-grad"></div>
          </div>
          <div class="pl-info">
            <div class="pl-title">${esc(pl.title||'Playlist')}</div>
            <div class="pl-curator">${esc(pl.user?.username||'SoundCloud')}</div>
            <div class="pl-meta-row">Playlist &nbsp;·&nbsp; ${pl.track_count||tracks.length} Tracks</div>
            <div class="pl-actions">
              <button class="pl-shuffle-btn" onclick="shufflePlay()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                  <polyline points="16 3 21 3 21 8" />
                  <line x1="4" y1="20" x2="21" y2="3" />
                  <polyline points="21 16 21 21 16 21" />
                  <line x1="15" y1="15" x2="21" y2="21" />
                </svg>
              </button>
            </div>
          </div>
          <div class="pl-track-list">
            ${tracks.map((t,i)=>`
              <div class="pl-track-item" id="pltItem${i}" onclick="playTrack(${i});openNowPlaying()">
                ${t.artwork_url
                  ? `<img class="pl-track-art" src="${esc(t.artwork_url)}" loading="lazy" alt="" onerror="this.outerHTML='<div class=\\'pl-track-art-ph\\'>🎵</div>'" />`
                  : `<div class="pl-track-art-ph">🎵</div>`}
                <div class="pl-track-info">
                  <div class="pl-track-title">${esc(t.title)}</div>
                  <div class="pl-track-artist">${esc(t.user?.username||'')}</div>
                </div>
                <div class="pl-track-dur">${fmtSec(t.duration/1000)}</div>
              </div>`).join('')}
          </div>
        </div>`;
      body.scrollTop = 0;
    }

    function shufflePlay() {
      if (!tracks.length) return;
      playTrack(Math.floor(Math.random()*tracks.length));
      openNowPlaying();
    }

    function playTrackDirect(t) {
      tracks = [t];
      currentContext = 'direct';
      playTrack(0);
      openNowPlaying();
    }

    function playTrack(idx) {
      const t = tracks[idx];
      if (!t) return;
      currentIdx = idx;

      document.querySelectorAll('.pl-track-item').forEach((el, i) => {
        el.classList.toggle('active', i === idx);
      });

      updateMiniPlayer(t);
      updateNowPlaying(t);

      if (t.permalink_url) {
        fetch('/scdl?url=' + encodeURIComponent(t.permalink_url))
          .then(r => r.json())
          .then(data => {
            const url = data.results?.audioUrl;
            if (url) { audio.src = url; audio.play(); setPause(false); }
          }).catch(()=>{});
      }
    }

    function updateMiniPlayer(t) {
      document.getElementById('miniPlayer').classList.add('visible');
      document.getElementById('miniTitle').textContent = t.title || '';
      document.getElementById('miniArtist').textContent = t.user?.username || '';
      const wrap = document.getElementById('miniArtWrap');
      if (t.artwork_url) {
        wrap.outerHTML = `<img class="mini-art" id="miniArtWrap" src="${esc(t.artwork_url)}" alt="" onerror="this.outerHTML='<div class=\\'mini-art-ph\\' id=\\'miniArtWrap\\'>🎵</div>'" />`
      }
    }

    function updateNowPlaying(t) {
      document.getElementById('npTitle').textContent = t.title || '';
      document.getElementById('npArtist').textContent = t.user?.username || '';
      document.getElementById('npLikeCount').textContent = fmtNum(t.likes_count);
      document.getElementById('npCommentCount').textContent = fmtNum(t.comment_count);
      document.getElementById('npRepostCount').textContent = fmtNum(t.reposts_count);

      const bg = t.artwork_url ? `url('${t.artwork_url.replace(/'/g,"\\'")}')` : 'none';
      document.getElementById('npFullBg').style.backgroundImage = bg;
      buildWaveform();
    }

    const WF_BARS = 80;
    let wfH = [];

    function buildWaveform() {
      wfH = Array.from({length: WF_BARS}, () => 12 + Math.random() * 88);
      renderWaveform(0);
    }

    function renderWaveform(progress) {
      const wf = document.getElementById('npWaveform');
      const split = Math.floor(progress * WF_BARS);
      wf.innerHTML = wfH.map((h,i)=>`<div class="np-wf-bar ${i<split?'played':'unplayed'}" style="height:${h}%"></div>`).join('');
    }

    function waveformSeek(e) {
      if (audio.duration) audio.currentTime = (e.offsetX / document.getElementById('npWaveform').clientWidth) * audio.duration;
    }

    function togglePlay() {
      if (!audio.src) return;
      if (audio.paused) { audio.play(); setPause(false); }
      else { audio.pause(); setPause(true); }
    }

    function setPause(paused) {
      const icon = paused ? '<path d="M8 5v14l11-7z"/>' : '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
      document.getElementById('npPlayIcon').innerHTML = icon;
      document.getElementById('miniPlayIcon').innerHTML = icon;
    }

    function skipTrack(dir) {
      if (!currentContext) return;
      const next = currentIdx + dir;
      if (next >= 0 && next < tracks.length) playTrack(next);
    }

    const searchInput = document.getElementById('searchInput');
    let searchTimer = null;
    searchInput.addEventListener('input', (e) => {
      clearTimeout(searchTimer);
      const q = e.target.value.trim();
      if (!q) {
        document.getElementById('searchBody').innerHTML = `
          <div class="search-grid" id="searchGenres">
            <div class="genre-card" style="background:linear-gradient(135deg,#f43f5e,#fb7185)" onclick="doGenreSearch('Hip-hop & Rap')">Hip-hop & Rap</div>
            <div class="genre-card" style="background:linear-gradient(135deg,#8b5cf6,#c084fc)" onclick="doGenreSearch('Electronic')">Electronic</div>
            <div class="genre-card" style="background:linear-gradient(135deg,#06b6d4,#67e8f9)" onclick="doGenreSearch('Pop')">Pop</div>
            <div class="genre-card" style="background:linear-gradient(135deg,#10b981,#34d399)" onclick="doGenreSearch('Rock')">Rock</div>
            <div class="genre-card" style="background:linear-gradient(135deg,#f59e0b,#fcd34d)" onclick="doGenreSearch('Alternative')">Alternative</div>
            <div class="genre-card" style="background:linear-gradient(135deg,#ec4899,#f472b6)" onclick="doGenreSearch('R&B & Soul')">R&B & Soul</div>
          </div>`;
        return;
      }
      searchTimer = setTimeout(() => performSearch(q), 350);
    });

    function doGenreSearch(genre) {
      searchInput.value = genre;
      performSearch(genre);
    }

    async function performSearch(q) {
      const body = document.getElementById('searchBody');
      body.innerHTML = '<div class="state-box"><div class="spinner"></div><p>Searching…</p></div>';
      try {
        const res = await fetch('/search?q=' + encodeURIComponent(q));
        const data = await res.json();
        const results = data.results || data.collection || [];
        if (!results.length) {
          body.innerHTML = '<div class="state-box"><p>No results found.</p></div>';
          return;
        }
        tracks = results.map(t => ({
          id: t.id,
          title: t.title || 'Track',
          duration: t.duration,
          artwork_url: t.artwork_url,
          permalink_url: t.permalink_url,
          user: { username: t.user?.username || 'SoundCloud' },
          playback_count: t.playback_count || 0,
          likes_count: t.likes_count || 0,
          comment_count: t.comment_count || 0
        }));
        currentContext = 'search';

        body.innerHTML = `
          <div class="search-results-list">
            ${tracks.map((t, i) => `
              <div class="search-track-item" onclick="playTrack(${i});openNowPlaying()">
                ${t.artwork_url ? `<img class="search-track-art" src="${esc(t.artwork_url)}" alt=""/>` : `<div class="search-track-art" style="display:flex;align-items:center;justify-content:center">🎵</div>`}
                <div class="search-track-info">
                  <div class="search-track-title">${esc(t.title)}</div>
                  <div class="search-track-artist">${esc(t.user?.username)}</div>
                </div>
              </div>
            `).join('')}
          </div>`;
      } catch {
        body.innerHTML = '<div class="state-box"><p style="color:#f87171">Search failed.</p></div>';
      }
    }

    audio.addEventListener('timeupdate', () => {
      const pct = audio.duration ? audio.currentTime / audio.duration : 0;
      document.getElementById('miniProgress').style.width = (pct * 100) + '%';
      document.getElementById('npTimeCur').textContent = fmtSec(audio.currentTime);
      document.getElementById('npTimeDur').textContent = fmtSec(audio.duration);
      renderWaveform(pct);
    });

    audio.addEventListener('ended', () => skipTrack(1));
    audio.addEventListener('play', () => setPause(false));
    audio.addEventListener('pause', () => setPause(true));

    loadDiscover();
  </script>
</body>
</html>
